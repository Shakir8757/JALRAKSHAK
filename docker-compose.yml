services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: jalrakshak-postgres
    environment:
      POSTGRES_DB: jalrakshak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d jalrakshak"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  ml-service:
    build: ./ml-service
    container_name: jalrakshak-ml
    ports: ["8000:8000"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jalrakshak-backend
    environment:
      PORT: 4000
      NODE_ENV: production
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: change-this-before-public-deployment-please
      JWT_EXPIRES_IN: 8h
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jalrakshak
      ML_SERVICE_URL: http://ml-service:8000
      MAP_SERVICE_URL: http://backend:4000
      USE_SYNTHETIC_DATA: "true"
    ports: ["4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
      ml-service: {condition: service_started}

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
      VITE_USE_MOCK_FALLBACK: "false"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
